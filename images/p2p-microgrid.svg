<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" role="img"
     aria-label="Schematic of a peer-to-peer microgrid: prosumer nodes with solar, wind, battery storage and inverter air-conditioner loads exchanging power around a common bus.">
  <defs>
    <style><![CDATA[
      .lbl  { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; font-size: 11.5px; fill: #57606a; }
      .node { fill: #ffffff; stroke: #0366d6; stroke-width: 1.6; }
      .ico  { fill: none; stroke: #0366d6; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
      .link { fill: none; stroke: #0366d6; stroke-width: 1.4; opacity: 0.45; }
      .flow { stroke-dasharray: 5 7; animation: flow 1.6s linear infinite; }
      @keyframes flow { to { stroke-dashoffset: -24; } }
      @media (prefers-reduced-motion: reduce) { .flow { animation: none; } }
    ]]></style>
    <marker id="ar" viewBox="0 0 8 8" refX="6" refY="4" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L8 4 L0 8 z" fill="#0366d6" opacity="0.6"/>
    </marker>
  </defs>

  <rect width="900" height="300" fill="#ffffff"/>

  <!-- common bus -->
  <line x1="120" y1="150" x2="780" y2="150" stroke="#24292e" stroke-width="3"/>
  <text class="lbl" x="120" y="172" fill="#24292e">common bus</text>

  <!-- P2P exchange arcs above the bus -->
  <path class="link flow" marker-end="url(#ar)" d="M235 108 C300 52 400 52 465 108"/>
  <path class="link flow" marker-end="url(#ar)" d="M665 108 C600 52 500 52 435 108"/>

  <!-- ============ node: solar prosumer ============ -->
  <line class="link" x1="220" y1="150" x2="220" y2="118"/>
  <circle class="node" cx="220" cy="90" r="30"/>
  <g class="ico" transform="translate(220 90)">
    <circle r="8"/>
    <path d="M0 -15 V-12 M0 12 V15 M-15 0 H-12 M12 0 H15
             M-10.6 -10.6 l2.1 2.1 M8.5 8.5 l2.1 2.1
             M10.6 -10.6 l-2.1 2.1 M-8.5 8.5 l-2.1 2.1"/>
  </g>
  <text class="lbl" x="220" y="146" text-anchor="middle">solar PV</text>

  <!-- ============ node: wind ============ -->
  <line class="link" x1="360" y1="150" x2="360" y2="118"/>
  <circle class="node" cx="360" cy="90" r="30"/>
  <g class="ico" transform="translate(360 90)">
    <circle r="2.6"/>
    <path d="M0 -3 C-2 -12 -1 -16 3 -18 C6 -14 4 -8 1.5 -3"/>
    <path d="M2.6 1.5 C10 6 14 9 13.5 13.5 C9 14.5 4.5 10 1.5 6"/>
    <path d="M-2.6 1.5 C-10 6 -14 9 -13.5 13.5 C-9 14.5 -4.5 10 -1.5 6"/>
  </g>
  <text class="lbl" x="360" y="146" text-anchor="middle">wind</text>

  <!-- ============ node: battery storage ============ -->
  <line class="link" x1="500" y1="150" x2="500" y2="118"/>
  <circle class="node" cx="500" cy="90" r="30"/>
  <g class="ico" transform="translate(500 90)">
    <rect x="-14" y="-8" width="26" height="16" rx="2.5"/>
    <path d="M12 -3 h3 v6 h-3"/>
    <path d="M-9 -4 v8 M-4 -4 v8 M1 -4 v8"/>
  </g>
  <text class="lbl" x="500" y="146" text-anchor="middle">battery storage</text>

  <!-- ============ node: inverter air-conditioner ============ -->
  <line class="link" x1="640" y1="150" x2="640" y2="118"/>
  <circle class="node" cx="640" cy="90" r="30"/>
  <g class="ico" transform="translate(640 90)">
    <rect x="-15" y="-11" width="30" height="14" rx="2.5"/>
    <path d="M-10 -6.5 h20 M-10 -2.5 h20"/>
    <path d="M-8 7 c2 3 -1 5 0 8 M0 7 c2 3 -1 5 0 8 M8 7 c2 3 -1 5 0 8"/>
  </g>
  <text class="lbl" x="640" y="146" text-anchor="middle">inverter AC load</text>

  <!-- ============ below-bus: controller ============ -->
  <line class="link" x1="430" y1="150" x2="430" y2="196"/>
  <rect class="node" x="352" y="196" width="156" height="48" rx="5"/>
  <text class="lbl" x="430" y="217" text-anchor="middle" fill="#24292e" font-weight="600">frequency regulator</text>
  <text class="lbl" x="430" y="233" text-anchor="middle">comfort-aware, delay-tolerant</text>

  <!-- measurement / command arrows -->
  <path class="link flow" marker-end="url(#ar)" d="M330 220 H300 C280 220 280 190 280 165" />
  <path class="link flow" marker-end="url(#ar)" d="M530 220 H560 C580 220 580 190 580 165" />
  <text class="lbl" x="262" y="196" text-anchor="end">&#916;f</text>
  <text class="lbl" x="598" y="196">setpoint</text>
</svg>
